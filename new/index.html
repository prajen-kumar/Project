<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value Education Quiz</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }

        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 20px; }
        button:hover { background-color: #2980b9; }
        .question-block { margin-bottom: 25px; padding: 15px; border: 1px solid #eee; border-radius: 8px; background-color: #fafafa; }
        .question-title { font-weight: bold; margin-bottom: 10px; }
        .option-label { display: block; margin-bottom: 8px; cursor: pointer; padding: 8px; border-radius: 5px; transition: background 0.2s; }
        .option-label:hover { background-color: #e9ecef; }

        .incorrect { background-color: #f8d7da !important; border-left: 5px solid #dc3545; }
        #quiz-section, #result-section { display: none; }
        .score-display { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 20px; color: #27ae60; }
    </style>
</head>
<body>

<div class="container" id="reg-section">
    <h1>Value Education Exam</h1>
    <p style="text-align:center;">Please enter your details to begin.</p>
    <div class="form-group"><label>Name</label><input type="text" id="s_name" required></div>
    <div class="form-group"><label>Roll Number</label><input type="text" id="s_roll" required></div>
    <div class="form-group"><label>Register Number</label><input type="text" id="s_reg" required></div>
    <div class="form-group"><label>Department</label><input type="text" id="s_dept" required></div>
    <button onclick="startQuiz()">Start Quiz</button>
</div>

<div class="container" id="quiz-section">
    <h2>Value Education - 50 Questions</h2>
    <div id="questions-container"></div>
    <button onclick="submitQuiz()" id="submit-btn">Submit Quiz</button>
</div>

<div class="container" id="result-section">
    <h1>Quiz Completed!</h1>
    <div class="score-display" id="final-score"></div>
    <p style="text-align:center;">Your score has been recorded. Scroll down to review your answers.</p>
    <div id="review-container"></div>
</div>

nd innovative solutions", "It hinders the scientific process", "It restricts scientists to established methods"], "answer": "It can lead to imaginative approaches and innovative solutions"}, {"question": "Values related to right conduct is  ________.", "options": ["Attention", "Accuracy", "Empathy", "Ethical skills"], "answer": "Ethical skills"}, {"question": "It is a crime committed by a person of respectability and high social status", "options": ["Blue collar crime", "Red collar crime", "White collar crime", "Black collar crime"], "answer": "White collar crime"}, {"question": "What is the primary focus of the National Commission for Protection of Child Rights (NCPCR) in India?", "options": ["Protecting the rights of adults", "Protecting the rights of women", "Protecting the rights of children", "Protecting the rights of transgender individuals"], "answer": "Protecting the rights of children"}, {"question": "Value Education takes place only at", "options": ["School", "Institutions", "Voluntary youth organizations", "All the above"], "answer": "All the above"}, {"question": "Who helped to provide leadership for the Sikhs in a very difficult and tumultuous time following the passing away of Gur Gobind Singh?", "options": ["Maharaja Ranjit Singh", "Sardarni  Sharnagat Kaur", "Mata Kishan Kaur", "Mata Sundri"], "answer": "Mata Sundri"}, {"question": "What term is commonly used to refer to individuals who may have physical, sensory, cognitive, or other impairments that may impact their daily life?", "options": ["Disabled", "Differently abled", "Impaired", "Special needs"], "answer": "Differently abled"}, {"question": "What is the significance of promoting tolerance and inclusivity in value education?", "options": ["It encourages discrimination", "It fosters social cohesion and harmony", "It leads to cultural isolation", "It promotes ethnocentrism"], "answer": "It fosters social cohesion and harmony"}, {"question": "What is introspection?", "options": ["The study of ext     let studentData = {};

    function startQuiz() {
        const n = document.getElementById('s_name').value;
        const ro = document.getElementById('s_roll').value;
        const re = document.getElementById('s_reg').value;
        const d = document.getElementById('s_dept').value;
        
        if(!n || !ro || !re || !d) { alert("Please fill all fields."); return; }
        
        studentData = { name: n, rollNo: ro, regNo: re, dept: d };
        
        document.getElementById('reg-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'block';
        renderQuestions();
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        let html = '';
        quizData.forEach((q, index) => {
            html += `<div class="question-block" id="qblock-${index}">
                <div class="question-title">${index + 1}. ${q.question}</div>`;
            q.options.forEach((opt, oIndex) => {
                html += `<label class="option-label" id="label-${index}-${oIndex}">
                    <input type="radio" name="q${index}" value="${opt}"> ${opt}
                </label>`;
            });
            html += `</div>`;
        });
        container.innerHTML = html;
    }

    function submitQuiz() {
        let score = 0;
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('submit-btn').innerText = "Submitting...";

        quizData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            
            if (selected) {
                if (selected.value === q.answer) {
                    score++;
                }
            }
        });

        const payload = {
            name: studentData.name,
            rollNo: studentData.rollNo,
            regNo: studentData.regNo,
            dept: studentData.dept,
            score: `${score} / 50`
        };

        if (SCRIPT_URL) {
            fetch(SCRIPT_URL, {
                redirect: "follow",
                method: "POST",
                body: JSON.stringify(payload),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            }).catch(e => console.log("Data send failed", e));
        }

        showResults(score);
    }

    function showResults(score) {
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('final-score').innerText = `Your Score: ${score} / 50`;

        const container = document.getElementById('review-container');
        let html = '';
        quizData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const userAns = selected ? selected.value : "None";
            const isCorrect = userAns === q.answer;
            
            html += `<div class="question-block ${isCorrect ? 'correct' : 'incorrect'}">
                <div class="question-title">${index + 1}. ${q.question}</div>
                <p><strong>Your Answer:</strong> ${userAns}</p>
                <p><strong>Correct Answer:</strong> ${q.answer}</p>
            </div>`;
